<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>明中·校史连连看 · 智能接入</title>
<!--
  多通道容灾路由中枢 v70
  二维码指向本页（部署在 GitHub Pages / CloudBase 各一份）。
  流程：清理旧SW → 并发探测所有游戏通道 → 谁先返回有效游戏内容就跳谁
        → 微信内优先免确认通道 → 全部失败展示手动线路面板。
  设计目标：任意单一通道故障，扫码仍能到达游戏。
-->
<link rel="preconnect" href="https://denghongzhang.github.io">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://byt-d2g8u4ybu5bd46c4f-1469780385.tcloudbaseapp.com">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#fff;overflow:hidden}
  body{background:linear-gradient(160deg,#7a1f14 0%,#b8432e 55%,#e08a3c 100%)}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .ring{width:52px;height:52px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite;margin-bottom:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:20px;font-weight:800;letter-spacing:2px;margin:0 0 8px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
  p{font-size:13px;opacity:.9;margin:4px 0;line-height:1.6}
  .status{margin-top:14px;font-size:12px;opacity:.85;min-height:20px;letter-spacing:.5px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffe08a;margin:0 3px;animation:bl 1.1s infinite}
  .dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
  .panel{display:none;width:100%;max-width:340px;margin-top:18px;max-height:64vh;overflow:auto}
  .panel.show{display:block}
  .card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.96);color:#7a1f14;border-radius:14px;padding:13px 15px;margin:9px 0;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .card:active{transform:translateY(1px)}
  .card .ic{font-size:22px;flex:0 0 auto}
  .card .tx{text-align:left;flex:1}
  .card .tt{font-size:15px;font-weight:800}
  .card .ds{font-size:11px;opacity:.7;margin-top:2px}
  .card .ar{font-size:18px;opacity:.5}
  .retry{display:inline-block;margin-top:8px;padding:10px 22px;border-radius:12px;background:#fff;color:#7a1f14;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  .brand{position:fixed;bottom:14px;left:0;width:100%;text-align:center;font-size:10px;letter-spacing:2px;opacity:.55}
  .mini{position:fixed;right:14px;bottom:14px;font-size:11px;opacity:.6;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.4);padding:5px 10px;border-radius:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ring" id="ring"></div>
  <h1 id="h1">正在为您接入游戏</h1>
  <p id="sub">智能检测全部线路 · 自动选择最快可用通道</p>
  <div class="status" id="status"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="panel" id="panel"></div>
</div>
<div class="brand">明中·校史连连看 · 多通道智能接入 v70</div>
<a class="mini" href="?manual=1">线路选择</a>
<script>
/* ============ 通道清单（全部为 v154 最新版，MD5 一致） ============ */
var CHANNELS = [
  { id:'gh',  icon:'🟢', name:'主线路 · GitHub Pages', desc:'微信免确认直接打开 · 全球加速',
    url:'https://denghongzhang.github.io/mingxi-yizhong/mingxi.html', mode:'cors', wxOK:true },
  { id:'jsd', icon:'🔵', name:'备用线路 · CDN 加速', desc:'国内节点镜像 · 微信免确认',
    url:'https://cdn.jsdelivr.net/gh/denghongzhang/mingxi-yizhong@main/mingxi.html', mode:'cors', wxOK:true },
  { id:'cb',  icon:'🟠', name:'备用线路 · 腾讯云', desc:'国内最快 · 微信内需点一次“确定访问”',
    url:'https://byt-d2g8u4ybu5bd46c4f-1469780385.tcloudbaseapp.com/mingxi.html', mode:'nocors', wxOK:false },
];
var IS_WX = /MicroMessenger/i.test(navigator.userAgent);
var FORCE_MANUAL = /[?&]manual=1/.test(location.search);
var decided = false;
var statusEl = document.getElementById('status');
var panelEl  = document.getElementById('panel');

/* 清理可能劫持导航的旧 Service Worker（同域历史遗留），跳转前执行，带超时上限 */
function purgeOldSW(){
  if(!('serviceWorker' in navigator)) return Promise.resolve();
  var work = (async function(){
    try{ var rs = await navigator.serviceWorker.getRegistrations();
         await Promise.all(rs.map(function(r){ try{ return r.unregister(); }catch(e){} })); }catch(e){}
    try{ if(window.caches && caches.keys){ var ks = await caches.keys();
         await Promise.all(ks.filter(function(k){ return /^fafu/i.test(k); }).map(function(k){ try{ return caches.delete(k); }catch(e){} })); } }catch(e){}
  })();
  return Promise.race([work, new Promise(function(res){ setTimeout(res, 700); })]);
}

/* 探测单个通道：cors 模式读取正文并校验游戏标记；nocors 模式连得通即视为可达 */
function probe(ch, budget){
  var t0 = performance.now();
  return new Promise(function(resolve){
    var timer = setTimeout(function(){ resolve({ch:ch, ok:false, ms:budget}); }, budget);
    if(ch.mode === 'cors'){
      fetch(ch.url + (ch.url.indexOf('?')<0?'?':'&') + 't=' + Date.now(),
            {method:'GET', cache:'no-store', mode:'cors'})
        .then(function(r){ if(!r.ok) throw 0; return r.text(); })
        .then(function(txt){
          clearTimeout(timer);
          var ok = /连连看|杉杉|canvas|<board|游戏/i.test(txt);
          resolve({ch:ch, ok:ok, ms:performance.now()-t0});
        })
        .catch(function(){ clearTimeout(timer); resolve({ch:ch, ok:false, ms:budget}); });
    }else{
      fetch(ch.url + (ch.url.indexOf('?')<0?'?':'&') + 't=' + Date.now(),
            {method:'GET', cache:'no-store', mode:'no-cors'})
        .then(function(){ clearTimeout(timer); resolve({ch:ch, ok:true, ms:performance.now()-t0}); })
        .catch(function(){ clearTimeout(timer); resolve({ch:ch, ok:false, ms:budget}); });
    }
  });
}

/* 并发探测一组通道，谁先返回有效就立刻返回该通道（赛跑） */
function firstOK(list, budget){
  return new Promise(function(resolve){
    var finished = false, pending = list.length;
    if(pending === 0){ resolve(null); return; }
    function done(r){ if(!finished){ finished = true; resolve(r); } }
    var totalTimer = setTimeout(function(){ done(null); }, budget + 500);
    list.forEach(function(ch){
      probe(ch, budget).then(function(r){
        if(r.ok){ clearTimeout(totalTimer); done(r); }
        else if(--pending === 0){ clearTimeout(totalTimer); done(null); }
      });
    });
  });
}

/* 记住上次成功的通道，非微信环境下次优先尝试 */
function lastGood(){ try{ return localStorage.getItem('mx_hub_good'); }catch(e){ return null; } }
function setLastGood(id){ try{ localStorage.setItem('mx_hub_good', id); }catch(e){} }

function go(ch){
  if(decided) return; decided = true;
  setLastGood(ch.id);
  statusEl.innerHTML = '✓ 已连接「' + escapeHtml(ch.name) + '」，正在进入…';
  var u = ch.url;
  setTimeout(function(){ try{ location.replace(u); }catch(e){ location.href = u; } }, 120);
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* 手动面板：列出全部通道，任何自动跳转失败时用户仍可一键进入 */
function showManual(title, sub){
  if(decided) return; decided = true;
  document.getElementById('ring').style.display = 'none';
  document.getElementById('h1').textContent = title || '请选择游戏线路';
  document.getElementById('sub').textContent = sub || '自动接入未成功，可手动选择任意线路';
  statusEl.innerHTML = '';
  var html = '';
  CHANNELS.forEach(function(ch){
    html += '<a class="card" href="' + ch.url + '">' +
            '<span class="ic">' + ch.icon + '</span>' +
            '<span class="tx"><span class="tt">' + escapeHtml(ch.name) + '</span>' +
            '<span class="ds">' + escapeHtml(ch.desc) + '</span></span>' +
            '<span class="ar">›</span></a>';
  });
  html += '<a class="retry" href="?">↻ 重新智能接入</a>';
  panelEl.innerHTML = html;
  panelEl.classList.add('show');
}

(async function(){
  try{ await purgeOldSW(); }catch(e){}
  if(FORCE_MANUAL){ showManual(); return; }

  var BUDGET = IS_WX ? 3200 : 2600;
  var order = CHANNELS.slice();
  var lg = lastGood();
  if(!IS_WX && lg){ order.sort(function(a,b){ return (b.id===lg)-(a.id===lg); }); }

  if(IS_WX){
    // 微信内：先赛跑免确认通道（gh/jsd），失败再尝试 CloudBase（需点一次确认）
    var fast = order.filter(function(c){ return c.wxOK; });
    var win = await firstOK(fast, BUDGET);
    if(win){ go(win.ch); return; }
    var slow = order.filter(function(c){ return !c.wxOK; });
    if(slow.length){
      var w2 = await firstOK(slow, 2200);
      if(w2){ go(w2.ch); return; }
    }
    showManual('自动接入未成功', '请手动选择线路（微信内若提示确认，点“确定访问”即可）');
  }else{
    var win2 = await firstOK(order, BUDGET);
    if(win2){ go(win2.ch); return; }
    showManual();
  }
})();

/* 终极兜底：8 秒内未离开本页，无论探测结果如何都展示手动入口 */
setTimeout(function(){ if(!decided) showManual(); }, 8000);
</script>
</body>
</html>
